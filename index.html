<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ランダムポケモン</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="container">
    <h1>ランダムポケモン</h1>
    <p class="subtitle">ボタンを押すとランダムなポケモンが表示されます</p>

    <button id="random-btn" type="button" class="random-btn">ランダムに表示！</button>

    <section id="pokemon-card" class="pokemon-card hidden">
      <div class="pokemon-image-wrap">
        <img id="pokemon-image" alt="" />
      </div>
      <h2 id="pokemon-name" class="pokemon-name"></h2>
      <p class="pokemon-id">No. <span id="pokemon-id"></span></p>

      <div class="pokemon-types" id="pokemon-types"></div>

      <dl class="pokemon-stats">
        <div>
          <dt>身長</dt>
          <dd><span id="pokemon-height"></span> m</dd>
        </div>
        <div>
          <dt>体重</dt>
          <dd><span id="pokemon-weight"></span> kg</dd>
        </div>
      </dl>

      <section class="pokemon-abilities">
        <h3>とくせい</h3>
        <ul id="pokemon-abilities"></ul>
      </section>
    </section>

    <p id="status" class="status" role="status" aria-live="polite"></p>
  </main>

  <script src="app.js"></script>
</body>
</html>
