<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>シンプルアラーム</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="container">
    <h1>シンプルアラーム</h1>

    <section class="clock-section">
      <div id="current-time" class="current-time">--:--:--</div>
      <div id="current-date" class="current-date">----/--/--</div>
    </section>

    <section class="form-section">
      <label for="alarm-time">アラーム時刻</label>
      <div class="form-row">
        <input type="time" id="alarm-time" step="1" />
        <input type="text" id="alarm-label" placeholder="ラベル（任意）" maxlength="40" />
        <button id="add-alarm" type="button">追加</button>
      </div>
    </section>

    <section class="list-section">
      <h2>アラーム一覧</h2>
      <ul id="alarm-list" class="alarm-list"></ul>
      <p id="empty-message" class="empty-message">アラームはまだありません。</p>
    </section>

    <div id="ringing-overlay" class="ringing-overlay hidden">
      <div class="ringing-card">
        <h2>⏰ アラーム</h2>
        <p id="ringing-label">時間です</p>
        <button id="stop-ringing" type="button">停止</button>
      </div>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
