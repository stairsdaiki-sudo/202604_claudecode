<svg viewBox="0 0 800 1000" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice" role="img" aria-label="やわらかな朝の光が差し込む、温かなコーヒーと観葉植物のあるくつろぎのシーン">
  <defs>
    <linearGradient id="bgWall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#FBF1DF"/>
      <stop offset="55%" stop-color="#F1DDB9"/>
      <stop offset="100%" stop-color="#D9BB8A"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.7" cy="0.22" r="0.55">
      <stop offset="0%"  stop-color="#FFFCF2" stop-opacity="1"/>
      <stop offset="50%" stop-color="#FFF1D9" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#FFFCF2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bloom" cx="0.5" cy="0.55" r="0.7">
      <stop offset="0%"   stop-color="#FFFCF2" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#FFFCF2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="table" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#E5C9A0"/>
      <stop offset="100%" stop-color="#BE9968"/>
    </linearGradient>
    <linearGradient id="mug" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#EFE3D0"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#A8B687"/>
      <stop offset="100%" stop-color="#788C5E"/>
    </linearGradient>
    <linearGradient id="leafSoft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#C5CFA9"/>
      <stop offset="100%" stop-color="#A2B181"/>
    </linearGradient>
    <linearGradient id="petal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#F8DEC9"/>
      <stop offset="100%" stop-color="#EDBE9C"/>
    </linearGradient>
    <linearGradient id="book" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#D9BD92"/>
      <stop offset="100%" stop-color="#B8966B"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <!-- Background wall with warm light -->
  <rect width="800" height="1000" fill="url(#bgWall)"/>
  <rect width="800" height="1000" fill="url(#sun)"/>
  <rect width="800" height="1000" fill="url(#bloom)"/>

  <!-- Soft light streaks (window) -->
  <g opacity="0.55" filter="url(#soft)">
    <ellipse cx="600" cy="160" rx="220" ry="120" fill="#FFFBEC"/>
    <ellipse cx="650" cy="220" rx="120" ry="80" fill="#FFFBEC"/>
  </g>

  <!-- Distant out-of-focus plant on wall (bokeh) -->
  <g opacity="0.5" filter="url(#soft)">
    <ellipse cx="120" cy="380" rx="90" ry="180" fill="#A2B181"/>
    <ellipse cx="180" cy="280" rx="60" ry="120" fill="#B6C396"/>
  </g>
  <g opacity="0.4" filter="url(#soft)">
    <ellipse cx="710" cy="430" rx="90" ry="60" fill="#E2C9A1"/>
  </g>

  <!-- Bokeh dots -->
  <g fill="#FFFBEC" opacity="0.55">
    <circle cx="240" cy="190" r="14"/>
    <circle cx="320" cy="120" r="8"/>
    <circle cx="690" cy="380" r="10"/>
    <circle cx="560" cy="80"  r="6"/>
    <circle cx="430" cy="160" r="5"/>
  </g>

  <!-- Subtle picture frame on wall -->
  <g opacity="0.55">
    <rect x="425" y="220" width="105" height="140" fill="#FFFFFF" rx="3"/>
    <rect x="438" y="233" width="79" height="114" fill="#E2C9A1" rx="2"/>
    <path d="M 445 320 L 470 280 L 492 305 L 510 287 L 510 343 L 445 343 Z" fill="#B79770" opacity="0.7"/>
  </g>

  <!-- ===== Eucalyptus branch top-left ===== -->
  <g transform="translate(-30,-10) rotate(-20 100 100)">
    <path d="M 80 60 Q 200 180 300 280" stroke="#7E8C5A" stroke-width="3" fill="none" stroke-linecap="round"/>
    <g fill="url(#leafSoft)">
      <ellipse cx="120" cy="100" rx="22" ry="11" transform="rotate(-30 120 100)"/>
      <ellipse cx="155" cy="135" rx="22" ry="11" transform="rotate(-15 155 135)"/>
      <ellipse cx="190" cy="170" rx="24" ry="12" transform="rotate(0 190 170)"/>
      <ellipse cx="225" cy="205" rx="22" ry="11" transform="rotate(15 225 205)"/>
      <ellipse cx="260" cy="240" rx="20" ry="10" transform="rotate(30 260 240)"/>
      <ellipse cx="100" cy="135" rx="20" ry="10" transform="rotate(40 100 135)"/>
      <ellipse cx="135" cy="170" rx="20" ry="10" transform="rotate(50 135 170)"/>
      <ellipse cx="170" cy="205" rx="20" ry="10" transform="rotate(65 170 205)"/>
    </g>
  </g>

  <!-- ===== Eucalyptus branch top-right ===== -->
  <g transform="translate(820,-20) rotate(20)">
    <path d="M -50 80 Q -160 200 -260 320" stroke="#7E8C5A" stroke-width="3" fill="none" stroke-linecap="round"/>
    <g fill="url(#leafSoft)">
      <ellipse cx="-90" cy="120" rx="22" ry="11" transform="rotate(30 -90 120)"/>
      <ellipse cx="-130" cy="155" rx="22" ry="11" transform="rotate(15 -130 155)"/>
      <ellipse cx="-170" cy="195" rx="24" ry="12" transform="rotate(0 -170 195)"/>
      <ellipse cx="-210" cy="235" rx="22" ry="11" transform="rotate(-15 -210 235)"/>
      <ellipse cx="-65" cy="155" rx="20" ry="10" transform="rotate(-40 -65 155)"/>
      <ellipse cx="-105" cy="190" rx="20" ry="10" transform="rotate(-55 -105 190)"/>
      <ellipse cx="-145" cy="225" rx="20" ry="10" transform="rotate(-65 -145 225)"/>
    </g>
  </g>

  <!-- ===== Table surface ===== -->
  <path d="M 0 720 L 800 720 L 800 1000 L 0 1000 Z" fill="url(#table)"/>
  <ellipse cx="400" cy="720" rx="800" ry="14" fill="#EFD7AE" opacity="0.7"/>
  <!-- Wood grain hints -->
  <g stroke="#A88660" stroke-width="1" opacity="0.18" fill="none">
    <path d="M 0 770 Q 400 765 800 775"/>
    <path d="M 0 830 Q 400 826 800 836"/>
    <path d="M 0 890 Q 400 885 800 895"/>
    <path d="M 0 950 Q 400 945 800 955"/>
  </g>

  <!-- ===== Open book under mug ===== -->
  <g>
    <path d="M 200 870 Q 400 855 600 870 L 605 940 Q 400 925 195 940 Z" fill="url(#book)"/>
    <path d="M 400 858 L 400 932" stroke="#8E6D45" stroke-width="2" opacity="0.5"/>
    <g stroke="#FAF1DD" stroke-width="1.4" opacity="0.7">
      <path d="M 240 890 L 380 880"/>
      <path d="M 240 905 L 370 895"/>
      <path d="M 240 920 L 380 910"/>
      <path d="M 420 880 L 560 890"/>
      <path d="M 420 895 L 570 905"/>
      <path d="M 420 910 L 560 920"/>
    </g>
  </g>

  <!-- ===== Coffee mug (centered on book) ===== -->
  <g>
    <!-- Mug shadow on book -->
    <ellipse cx="400" cy="870" rx="115" ry="12" fill="#7A5A38" opacity="0.18"/>

    <!-- Saucer -->
    <ellipse cx="400" cy="865" rx="135" ry="22" fill="url(#mug)"/>
    <ellipse cx="400" cy="861" rx="125" ry="16" fill="#E9DCC4"/>

    <!-- Mug body -->
    <path d="M 320 720 L 322 850 Q 322 870 350 875 L 450 875 Q 478 870 478 850 L 480 720 Z" fill="url(#mug)"/>
    <!-- Mug top (coffee) -->
    <ellipse cx="400" cy="722" rx="80" ry="16" fill="#3A2418"/>
    <ellipse cx="400" cy="720" rx="76" ry="13" fill="#5C3F2A"/>
    <!-- Cream highlight on coffee -->
    <ellipse cx="385" cy="717" rx="22" ry="3" fill="#A87F58" opacity="0.65"/>
    <ellipse cx="380" cy="716" rx="10" ry="2" fill="#C9A57B" opacity="0.7"/>
    <!-- Rim -->
    <ellipse cx="400" cy="720" rx="80" ry="16" fill="none" stroke="#E5D3B7" stroke-width="2"/>
    <!-- Mug shading -->
    <path d="M 326 740 Q 332 800 340 855" stroke="#E5D3B7" stroke-width="3" fill="none" opacity="0.5"/>
    <path d="M 474 740 Q 470 800 462 855" stroke="#C8B393" stroke-width="3" fill="none" opacity="0.45"/>
    <!-- Handle -->
    <path d="M 478 750 Q 530 752 530 800 Q 530 845 478 843"
          stroke="url(#mug)" stroke-width="18" fill="none" stroke-linecap="round"/>
    <path d="M 478 770 Q 514 772 514 802 Q 514 832 478 832"
          stroke="#EFE3D0" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- ===== Steam ===== -->
  <g stroke="#FFFFFF" stroke-width="4" fill="none" opacity="0.55" stroke-linecap="round">
    <path d="M 365 690 Q 358 660 372 630 Q 386 600 372 568 Q 358 540 372 510"/>
    <path d="M 400 695 Q 394 666 408 640 Q 420 612 410 586"/>
    <path d="M 435 690 Q 430 664 442 638 Q 452 614 444 590 Q 436 568 444 548"/>
  </g>
  <g stroke="#FFFFFF" stroke-width="2.5" fill="none" opacity="0.35" stroke-linecap="round">
    <path d="M 350 700 Q 340 670 350 640"/>
    <path d="M 460 695 Q 470 666 460 636"/>
  </g>

  <!-- ===== Small leaf on table ===== -->
  <g transform="translate(610,790) rotate(-20)">
    <path d="M 0 0 Q 30 -8 60 0 Q 30 10 0 0 Z" fill="url(#leaf)"/>
    <path d="M 0 0 L 60 0" stroke="#5E6E45" stroke-width="0.8" opacity="0.7"/>
  </g>
  <g transform="translate(180,800) rotate(15)">
    <path d="M 0 0 Q 25 -7 50 0 Q 25 8 0 0 Z" fill="url(#leafSoft)"/>
  </g>

  <!-- ===== Soft floating petal ===== -->
  <g opacity="0.7">
    <circle cx="250" cy="540" r="6" fill="url(#petal)"/>
    <circle cx="310" cy="600" r="4" fill="url(#petal)"/>
    <circle cx="540" cy="500" r="5" fill="url(#petal)"/>
  </g>

  <!-- Vignette -->
  <radialGradient id="vignette" cx="0.5" cy="0.5" r="0.95">
    <stop offset="65%" stop-color="#000" stop-opacity="0"/>
    <stop offset="100%" stop-color="#3F2B1E" stop-opacity="0.18"/>
  </radialGradient>
  <rect width="800" height="1000" fill="url(#vignette)"/>
</svg>
